<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Portal - InsuraMind AI</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=4" />
</head>
<body data-login-redirect="../pages/dashboard.html" data-register-redirect="../pages/dashboard.html" data-allowed-roles="customer" data-register-enabled="true">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Customer Portal</h2>
      <p class="subtitle">Sign in to submit claims and view your dashboard.</p>

      <div class="demo-box">
        <strong>Demo account</strong>
        Email: <code>customer@insuramind.local</code><br />
        Password: <code>password123</code><br />
        <button type="button" class="small secondary" style="margin-top:10px;" onclick="fillDemoCredentials('customer@insuramind.local', 'password123')">Use demo login</button>
      </div>

      <div id="auth-error" class="error"></div>

      <h3 style="font-size:16px; margin-bottom:12px;">Log in</h3>
      <form onsubmit="handleLogin(event)">
        <input id="login-email" type="email" placeholder="Email address" required />
        <input id="login-password" type="password" placeholder="Password" required />
        <button type="submit" style="width:100%;">Log in</button>
      </form>

      <hr class="auth-divider" />

      <h3 style="font-size:16px; margin-bottom:12px;">New customer? Register</h3>
      <form onsubmit="handleRegister(event)">
        <input id="register-email" type="email" placeholder="Email address" required />
        <input id="register-password" type="password" placeholder="Password (min 6 chars)" required minlength="6" />
        <button type="submit" class="secondary" style="width:100%;">Create account</button>
      </form>

      <a class="portal-link" href="../agent/index.html">Agent or admin? Go to Agent Portal →</a>
      <a class="portal-link muted" href="../index.html">← Back to portal chooser</a>
    </div>
  </div>

  <script src="../assets/js/state.js?v=4"></script>
  <script src="../assets/js/api.js?v=4"></script>
  <script src="../assets/js/auth.js?v=4"></script>
</body>
</html>
